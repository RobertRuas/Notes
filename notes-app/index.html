<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover respeita notch; NÃO usamos user-scalable=no por acessibilidade.
       O zoom automático no foco é prevenido via CSS (font-size >= 16px). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d6efd" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Bloco de Notas</title>

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  />
  <!-- Google Fonts: Inter (UI) + Instrument Serif (títulos) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap"
    rel="stylesheet"
  />
  <!-- Estilos próprios -->
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <!-- Fundo decorativo (blobs animados) -->
  <div class="bg-decor" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Barra de navegação (visível só quando o usuário está logado) -->
  <nav id="navbar" class="navbar navbar-expand-lg app-navbar d-none">
    <div class="container">
      <a class="navbar-brand" href="#/notes">
        <span class="brand-mark"><i class="bi bi-journal-text"></i></span>
        <span class="brand-text">Notas</span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <!-- Botão de alternância de tema -->
        <button id="btnTheme" class="btn btn-icon" title="Alternar tema" aria-label="Alternar tema">
          <i class="bi bi-moon-stars"></i>
        </button>
        <!-- Menu do usuário -->
        <div class="dropdown">
          <button
            class="btn btn-user dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <span class="avatar" id="userAvatar"></span>
            <span id="userLabel" class="d-none d-sm-inline"></span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <a class="dropdown-item" href="#/notes">
                <i class="bi bi-journal-text me-2"></i>Minhas notas
              </a>
            </li>
            <li>
              <a class="dropdown-item" href="#/profile">
                <i class="bi bi-person-gear me-2"></i>Perfil
              </a>
            </li>
            <li>
              <a class="dropdown-item" href="#/settings">
                <i class="bi bi-gear me-2"></i>Configurações
              </a>
            </li>
            <li><hr class="dropdown-divider" /></li>
            <li>
              <button id="btnLogout" class="dropdown-item text-danger">
                <i class="bi bi-box-arrow-right me-2"></i>Sair
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <!-- Área principal onde cada "página" é carregada -->
  <main id="app" class="container py-4"></main>

  <!-- Container global de alertas (toasts) -->
  <div
    id="toastContainer"
    class="toast-container position-fixed top-0 end-0 p-3"
    style="z-index: 1100"
  ></div>

  <!-- Bootstrap JS (bundle inclui Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- env.js é gerado pelo GitHub Actions a partir do secret API_KEY.
       No ambiente local, se o arquivo não existir, 404 silencioso é OK. -->
  <script src="assets/js/env.js"></script>
  <!-- Scripts da aplicação (ordem importa: dependências primeiro) -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/scale.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/notes.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/router.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
