<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#d97706" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Bloco de Notas</title>

  <!-- Impede cache agressivo para ver updates rápidos -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap"
    rel="stylesheet"
  />
  <!-- Estilos próprios (?v= força bust de cache ao publicar nova versão) -->
  <link rel="stylesheet" href="assets/css/style.css?v=5" />
</head>
<body>

  <!-- Fundo decorativo -->
  <div class="bg-decor" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Layout: shell com sidebar (desktop) + topbar (mobile) -->
  <div id="shell" class="app-shell d-none">

    <!-- Sidebar (desktop ≥ lg) / offcanvas (mobile) -->
    <aside class="app-sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="sidebar"
           aria-labelledby="sidebarLabel">
      <!-- Header da sidebar -->
      <div class="sidebar-header">
        <a href="#/notes" class="sidebar-brand" data-close-sidebar>
          <span class="brand-mark"><i class="bi bi-journal-text"></i></span>
          <span class="brand-text">Notas</span>
        </a>
        <button
          type="button"
          class="btn-close d-lg-none"
          data-bs-dismiss="offcanvas"
          data-bs-target="#sidebar"
          aria-label="Fechar"></button>
      </div>

      <!-- Navegação -->
      <nav class="sidebar-nav" aria-label="Navegação principal">
        <a class="nav-link" id="sidebarNewNote" href="#/notes" data-close-sidebar>
          <i class="bi bi-plus"></i>
          <span>Nova nota</span>
        </a>
        <a class="nav-link" href="#/notes" data-nav="#/notes" data-close-sidebar>
          <i class="bi bi-journal"></i>
          <span>Notas</span>
        </a>
        <a class="nav-link" href="#/profile" data-nav="#/profile" data-close-sidebar>
          <i class="bi bi-person"></i>
          <span>Perfil</span>
        </a>
        <a class="nav-link" href="#/settings" data-nav="#/settings" data-close-sidebar>
          <i class="bi bi-sliders"></i>
          <span>Preferências</span>
        </a>
      </nav>

      <!-- Rodapé: tema + usuário -->
      <div class="sidebar-footer">
        <a id="btnTheme" class="nav-link" href="#" aria-label="Alternar tema">
          <i class="bi bi-moon-stars"></i>
          <span>Tema</span>
        </a>
        <a id="btnLogout" class="nav-link" href="#" aria-label="Sair">
          <i class="bi bi-box-arrow-right"></i>
          <span>Sair</span>
        </a>

        <div class="user-card" title="Sessão ativa">
          <span class="avatar" id="userAvatar"></span>
          <div class="user-info">
            <div class="user-name" id="userLabel"></div>
            <div class="user-email" id="userEmail"></div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Conteúdo principal -->
    <div class="app-main">
      <!-- Topbar (mobile apenas) -->
      <header class="app-topbar d-lg-none">
        <button
          class="btn btn-icon"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#sidebar"
          aria-label="Abrir menu">
          <i class="bi bi-list"></i>
        </button>
        <a href="#/notes" class="topbar-brand">
          <span class="brand-mark"><i class="bi bi-journal-text"></i></span>
          <span class="brand-text">Notas</span>
        </a>
        <button id="btnThemeMobile" class="btn btn-icon" aria-label="Alternar tema">
          <i class="bi bi-moon-stars"></i>
        </button>
      </header>

      <main id="app" class="app-content"></main>
    </div>
  </div>

  <!-- Container das telas públicas (sem sidebar) -->
  <main id="publicApp" class="container py-4"></main>

  <!-- Toasts -->
  <div
    id="toastContainer"
    class="toast-container position-fixed top-0 end-0 p-3"
    style="z-index: 1100"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- env.js é gerado pelo workflow (secret API_KEY) -->
  <script src="assets/js/env.js?v=5"></script>
  <script src="assets/js/config.js?v=5"></script>
  <script src="assets/js/theme.js?v=5"></script>
  <script src="assets/js/scale.js?v=5"></script>
  <script src="assets/js/utils.js?v=5"></script>
  <script src="assets/js/api.js?v=5"></script>
  <script src="assets/js/auth.js?v=5"></script>
  <script src="assets/js/notes.js?v=5"></script>
  <script src="assets/js/ui.js?v=5"></script>
  <script src="assets/js/router.js?v=5"></script>
  <script src="assets/js/app.js?v=5"></script>
</body>
</html>
